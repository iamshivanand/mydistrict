services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mydistrict
      POSTGRES_PASSWORD: mydistrict
      POSTGRES_DB: mydistrict
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydistrict"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://mydistrict:mydistrict@postgres:5432/mydistrict?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ../services/api/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run dev -w services/api

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: npm run dev -w apps/web

  admin:
    build:
      context: ..
      dockerfile: infra/admin.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - api
    command: npm run dev -w apps/admin

volumes:
  pgdata:
